name: MLX unit tests

on:
  pull_request:
  push:

# Job display name below is the required status check on main.
# Do not rename it without updating the repository ruleset.
concurrency:
  group: mlx-unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mlx-unit-tests:
    name: macos-26 (no weights)
    runs-on: macos-26
    env:
      ALPAMAYO_CI_NO_WEIGHTS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight MLX test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest==9.0.3 \
            numpy==2.4.4 \
            scipy==1.17.1 \
            pandas==3.0.3 \
            einops==0.8.2 \
            pillow==12.2.0 \
            safetensors==0.7.0 \
            transformers==5.8.0 \
            torch==2.12.0 \
            mlx==0.31.2 \
            mlx-lm==0.31.3 \
            mlx-vlm==0.5.0

      - name: Run unit tests (no weight load)
        run: python -m pytest mlx_port/tests -m "not slow" -q --tb=short
