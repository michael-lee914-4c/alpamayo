[project]
name = "alpamayo_r1"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "accelerate>=1.12.0",
  "av>=16.0.1",
  "cosmos-rl",
  "einops>=0.8.1",
  "hydra-colorlog>=1.2.0",
  "hydra-core>=1.3.2",
  "mediapy>=1.2.4",
  "opencv-python>=4.10.0",
  "pandas>=2.3.3",
  "physical_ai_av>=0.2.0",
  "pillow>=12.0.0",
  "torch==2.8.0",
  "torchvision>=0.23.0",
  "transformers==4.57.1",
  "flash-attn>=2.8.3",
  "rich>=14.3.3",
  "wandb>=0.25.0",
  "torchmetrics==1.8.2",
  "deepspeed==0.18.2",
  "vllm==0.11.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

# Ship both the library (`alpamayo_r1` under `src/`) and the Cosmos-RL finetune
# package as top-level `rl` (`finetune/rl/`). After `pip install`, use
# `import alpamayo_r1` and `import rl` — no manual PYTHONPATH / sys.path edits.
[tool.hatch.build.targets.wheel]
packages = ["src/alpamayo_r1", "finetune/rl"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/src", "/finetune/rl"]

[dependency-groups]
dev = [
  "matplotlib>=3.10.7",
  "mediapy>=1.2.4",
  "ipykernel>=6.29.3",
  "ipywidgets>=8.1.8",
]
# macOS GitHub Actions only. Installed with `uv pip install --group mlx-ci`
# so the CUDA project dependencies (flash-attn, vllm, …) are not pulled in.
mlx-ci = [
  "pytest==9.0.3",
  "numpy==2.4.4",
  "scipy==1.17.1",
  "pandas==3.0.3",
  "einops==0.8.2",
  "pillow==12.2.0",
  "safetensors==0.7.0",
  "transformers==5.8.0",
  "torch==2.12.0",
  "mlx==0.31.2",
  "mlx-lm==0.31.3",
  "mlx-vlm==0.5.0",
  "hydra-core>=1.3.2",
  "hydra-colorlog>=1.2.0",
  "pyyaml>=6.0",
]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[tool.uv.sources]
cosmos-rl = { git = "https://github.com/nvidia-cosmos/cosmos-rl.git", rev = "747d1bd" }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
  "slow: needs local weights, Metal, or the PAI-CoC SSD",
]
